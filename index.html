<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will You Be Mine 💖</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff4d6d, #ff758f);
  text-align: center;
  color: white;
  overflow-x: hidden;
}

h1 {
  margin-top: 20px;
}

.gallery img {
  width: 85%;
  max-width: 320px;
  margin: 12px;
  border-radius: 18px;
  box-shadow: 0 0 18px rgba(0,0,0,0.35);
}

.buttons {
  margin: 25px 0;
  position: relative;
}

button {
  font-size: 20px;
  padding: 14px 32px;
  margin: 10px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

.yes {
  background: #2ecc71;
  color: white;
}

.no {
  background: #e74c3c;
  color: white;
  position: absolute;
}

#ring {
  font-size: 80px;
  display: none;
  margin-top: 20px;
  animation: pop 0.8s ease-in-out infinite alternate;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.3); }
}

#yesMessage {
  display: none;
  font-size: 28px;
  margin-top: 15px;
  font-weight: bold;
}

/* Fireworks */
.firework {
  position: fixed;
  width: 6px;
  height: 6px;
  background: transparent;
  border-radius: 50%;
  animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
  from {
    transform: scale(0);
    opacity: 1;
  }
  to {
    transform: scale(20);
    opacity: 0;
  }
}
</style>
</head>

<body>

<h1>Will you be mine forever? 💖</h1>

<!-- Music -->
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Photos -->
<div class="gallery">
  <img src="photo1.jpg">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
  <img src="photo4.jpg">
</div>

<!-- Buttons -->
<div class="buttons">
  <button class="yes" onclick="yesClicked()">YES 💖</button>
  <button class="no" id="noBtn" onmouseover="moveNo()">NO 😜</button>
</div>

<div id="ring">💍</div>
<div id="yesMessage">She said YES 💖💍</div>

<script>
const noBtn = document.getElementById("noBtn");

function moveNo() {
  const x = Math.random() * 200 - 100;
  const y = Math.random() * 200 - 100;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

function yesClicked() {
  document.getElementById("ring").style.display = "block";
  document.getElementById("yesMessage").style.display = "block";
  launchFireworks();
}

function launchFireworks() {
  for (let i = 0; i < 15; i++) {
    setTimeout(createFirework, i * 200);
  }
}

function createFirework() {
  const firework = document.createElement("div");
  firework.className = "firework";
  firework.style.left = Math.random() * 100 + "vw";
  firework.style.top = Math.random() * 100 + "vh";
  firework.style.boxShadow = `
    0 0 10px red,
    0 0 20px yellow,
    0 0 30px pink,
    0 0 40px white
  `;
  document.body.appendChild(firework);

  setTimeout(() => {
    firework.remove();
  }, 1200);
}
</script>

</body>
</html>
