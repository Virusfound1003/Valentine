<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mousmitha ❤️</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body {
  background: linear-gradient(135deg, #ff4e8a, #ff9a9e);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin-top: 40px;
  font-size: 2.2em;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #fff; }
  to { text-shadow: 0 0 25px #ffeb3b; }
}

p { margin: 20px; font-size: 1.1em; }

.gallery img {
  width: 85%;
  max-width: 320px;
  border-radius: 20px;
  margin: 15px auto;
  display: block;
  box-shadow: 0 10px 20px rgba(0,0,0,.4);
}

.buttons {
  margin: 30px;
}

button {
  padding: 15px 30px;
  font-size: 1.1em;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  margin: 10px;
}

#yes {
  background: #00e676;
  color: black;
}

#no {
  background: #ff1744;
  color: white;
  position: absolute;
}

.hearts span {
  position: fixed;
  bottom: -10px;
  font-size: 24px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body onclick="playMusic()">

<h1>Monica Raja ❤️ Mousmitha</h1>

<p>
நீ சிரிச்சா உலகமே அழகா தெரியும்…  
உன் குரலில் என் இதயம் வீடு கட்டிக்கிட்டது 💖  
என் வாழ்க்கை முழுக்க…  
**நீயா இருக்கிறியா?** 🥺❤️
</p>

<div class="gallery">
  <img src="photo1.jpg">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
  <img src="photo4.jpg">
</div>

<div class="buttons">
  <button id="yes" onclick="yesClick()">YES 💖</button>
  <button id="no" onmouseover="moveNo()">NO 😜</button>
</div>

<canvas id="fireworks"></canvas>

<audio id="music" src="music.mp3"></audio>

<script>
// Floating hearts
setInterval(() => {
  const heart = document.createElement('span');
  heart.innerHTML = '❤️';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 300);

// NO button escape
function moveNo() {
  const no = document.getElementById('no');
  no.style.left = Math.random() * 80 + 'vw';
  no.style.top = Math.random() * 80 + 'vh';
}

// YES click
function yesClick() {
  alert("YAY!!! 💖 I LOVE YOU ❤️");
  startFireworks();
  const text = encodeURIComponent("I said YES ❤️💍");
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

// Music play on first tap
function playMusic() {
  document.getElementById('music').play();
  document.body.onclick = null;
}

// Fireworks
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

function startFireworks() {
  for (let i = 0; i < 200; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 100
    });
  }
  animate();
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    ctx.fillStyle = 'yellow';
    ctx.fillRect(p.x, p.y, 3, 3);
    if (p.life <= 0) particles.splice(i, 1);
  });
  if (particles.length > 0) requestAnimationFrame(animate);
}
</script>

</body>
</html>
