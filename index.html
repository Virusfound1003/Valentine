<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd1dc, #ff9eb5);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  max-width: 600px;
  text-align: center;
}

h1, h2 {
  color: #e91e63;
}

button {
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  font-size: 16px;
  margin: 10px;
}

.yes {
  background: #ff4081;
  color: white;
}

.no {
  background: white;
  border: 2px solid #ff4081;
}

.gallery img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 15px;
  margin: 5px;
}

.letter {
  max-height: 300px;
  overflow-y: auto;
  text-align: left;
  white-space: pre-line;
  margin-top: 15px;
}
</style>
</head>

<body>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mp3">
</audio>

<div class="card">

<div class="gallery">
  <img src="photo1.jpg">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
</div>

<h1 id="title">Valentine Surprise ❤️</h1>

<p id="message">Hi Moni ❤️</p>

<div id="buttons">
  <button onclick="nextMessage()">Next 💌</button>
</div>

</div>

<script>
let step = 0;

const messages = [
  "Hi Moni ❤️",
  "I made something special just for you ✨",
  "Because you are the most beautiful part of my life 💖",
  "Will you be my Valentine forever? 💍"
];

function nextMessage() {
  step++;
  if (step < messages.length - 1) {
    document.getElementById("message").innerText = messages[step];
  } else {
    document.getElementById("message").innerText = messages[step];
    document.getElementById("buttons").innerHTML = `
      <button class="yes" onclick="showLetter()">Yes ❤️</button>
      <button class="no" onmouseover="moveNo(this)">No 🙈</button>
    `;
  }
}

function moveNo(btn) {
  btn.style.position = "relative";
  btn.style.left = Math.random() * 200 - 100 + "px";
  btn.style.top = Math.random() * 200 - 100 + "px";
}

function showLetter() {
  document.getElementById("title").innerText = "You Said Yes! 💖";
  document.getElementById("buttons").innerHTML = "";

  document.getElementById("message").innerHTML = `
  <div class="letter">
Moni,
Happy Valentine’s Day, en chellam.
Three years… moondru varusham. But nijama sollanum na, it still feels like yesterday dhaan namma office la first time paathadhu.

Rendu perum normal colleagues… but kadhal silently start aagiduchu.

Un dimple paatha udane en manasu calm aagidum.
Andha one strand of hair un mugathula vizhum pothu… naan iruken nu sollanum pola irukum.

Bangalore phase… adha ninaicha kooda enakku guilt varudhu.
Naan unnai ignore panninen.
Adhu en thappu, Moni.

Aana nee vittu pogala.
Nee namma kadhal ah kaapathina.

Love na responsibility.
Love na understanding.
Love na “naan un kooda iruken” nu kaatardhu.

Indha Valentine’s Day la naan oru urudhi solren —
Ego mela kadhal ah choose panren.

Nee en safe place.
Nee en blessing.

Happy Valentine’s Day, en Moni.
En uyir, en kadhal, en future.
Forever unnudan,
Unnoda aalu 🤍
  </div>
  `;
}
</script>

</body>
</html>
