<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monica ❤️ Mousmitha</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }

body {
  background: radial-gradient(circle at top, #ff5fa2, #ff1b6b);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

h1 {
  margin-top: 30px;
  font-size: 2.4em;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #fff; }
  to { text-shadow: 0 0 30px gold; }
}

.poem {
  margin: 25px;
  font-size: 1.15em;
  line-height: 1.8;
}

.gallery img {
  width: 85%;
  max-width: 330px;
  border-radius: 20px;
  margin: 15px auto;
  display: block;
  box-shadow: 0 15px 25px rgba(0,0,0,.4);
}

.buttons {
  margin: 30px;
  position: relative;
  height: 120px;
}

button {
  padding: 15px 32px;
  font-size: 1.1em;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: #00ff9c;
  color: black;
}

#no {
  background: #ff1744;
  color: white;
  position: absolute;
}

.hearts span {
  position: fixed;
  bottom: -10px;
  font-size: 24px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}

#ring {
  font-size: 80px;
  display: none;
  animation: pop 1s ease infinite alternate;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.2); }
}
</style>
</head>

<body onclick="playMusic()">

<h1>மோனிகா ராஜா ❤️ மௌஸ்மிதா</h1>

<div class="poem">
நீ சிரிக்கும் அந்த ஒரு நொடியில்  
என் உலகம் நிற்கிறது 💫<br><br>
உன் குரல் என் இதயத்தின் பிடித்த இசை 🎶<br>
உன் பார்வை என் வாழ்க்கையின் வெளிச்சம் ✨<br><br>
இந்த வாழ்க்கை முழுவதும்  
**என் கை பிடித்து நடப்பாயா?** 💍❤️
</div>

<div class="gallery">
  <img src="photo1.jpg">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
  <img src="photo4.jpg">
</div>

<div class="buttons">
  <button id="yes" onclick="yesClick()">YES 💖</button>
  <button id="no" onmouseover="moveNo()">NO 😜</button>
</div>

<div id="ring">💍</div>

<canvas id="fireworks"></canvas>
<audio id="music" src="music.mp3"></audio>

<script>
// Floating hearts
setInterval(() => {
  const heart = document.createElement('span');
  heart.innerHTML = '❤️';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 300);

// NO button escape
function moveNo() {
  const no = document.getElementById('no');
  no.style.left = Math.random() * 80 + 'vw';
  no.style.top = Math.random() * 60 + 'px';
}

// YES button
function yesClick() {
  document.getElementById('ring').style.display = 'block';
  startFireworks();
  alert("She said YES 💖💍");
  const text = encodeURIComponent("I said YES ❤️💍 Forever starts now!");
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

// Music play on first tap
function playMusic() {
  document.getElementById('music').play();
  document.body.onclick = null;
}

// Fireworks
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];

function startFireworks() {
  for (let i = 0; i < 250; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 9,
      vy: (Math.random() - 0.5) * 9,
      life: 120
    });
  }
  animate();
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    ctx.fillStyle = 'gold';
    ctx.fillRect(p.x, p.y, 3, 3);
    if (p.life <= 0) particles.splice(i, 1);
  });
  if (particles.length > 0) requestAnimationFrame(animate);
}
</script>

</body>
</html>
